<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden;height:100vh}

/* BOTON FLOTANTE VERDE */
#btnFlotante{
  position:fixed;
  left:60px; top:250px;
  width:62px; height:62px;
  background:#00ff88;
  color:#000;
  border:none;
  border-radius:50%;
  font-size:28px;
  font-weight:900;
  z-index:1000;
  box-shadow:0 0 20px rgba(0,255,136,.8);
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

/* MENU DE FUNCIONES - FLOTANTE Y MOVIBLE */
#menuFlotante{
  position:fixed;
  left:60px; top:340px;
  width:280px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:12px;
  display:none;
  z-index:999;
  touch-action:none;
  box-shadow:0 10px 30px rgba(0,0,0,.8);
}

/* CABECERA PARA MOVER EL MENU */
#cabeceraMenu{
  display:flex;
  align-items:center;
  gap:8px;
  padding:4px 4px 10px 4px;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#cabeceraMenu:active{cursor:grabbing}
#miniCerrar{
  width:30px; height:30px;
  background:#00ff88;
  color:#000;
  border:none;
  border-radius:50%;
  font-size:16px;
  font-weight:900;
  flex-shrink:0;
}
#cabeceraMenu b{font-size:15px;letter-spacing:1px}
#cabeceraMenu span{font-size:11px;color:#888;margin-left:auto}

.fila{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#222;
  border:1px solid #444;
  border-radius:12px;
  padding:12px;
  margin:6px 0;
}
.fila.activo{border-color:#00ff88;background:#123324}
.fila span{font-size:13px;font-weight:700}
.estado{font-size:11px;padding:4px 9px;border-radius:20px;background:#444;color:#fff;margin-top:3px;display:inline-block}
.fila.activo .estado{background:#00ff88;color:#000}

.switch{position:relative;width:48px;height:26px;background:#555;border-radius:30px;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:#00ff88}
.switch.on::after{left:25px}
</style>
</head>
<body>

<button id="btnFlotante">☰</button>

<div id="menuFlotante">
  <!-- CABECERA MOVIBLE + MINI BOTON PARA CERRAR -->
  <div id="cabeceraMenu">
    <button id="miniCerrar">☰</button>
    <b>MENÚ</b>
    <span>↕ mover</span>
  </div>

  <div id="contenedorOpciones"></div>
</div>

<script>
// LISTA DE OPCIONES - SOLO VISUAL, NO CONECTA CON NINGUN JUEGO
const opciones = [
  "ESP FOV",
  "ESP LÍNEA",
  "ESP VIDA",
  "GHOST",
  "UNDER MAP",
  "AIM",
  "CAMBIO RÁPIDO"
];

let cont = document.getElementById('contenedorOpciones');
let estados = {};

opciones.forEach(nombre => {
  estados[nombre] = false;
  let div = document.createElement('div');
  div.className = 'fila';
  div.id = 'fila-' + nombre;
  div.innerHTML = `<div><span>${nombre}</span><br><span class="estado">OFF</span></div><div class="switch"></div>`;
  div.onclick = (e) => {
    e.stopPropagation();
    estados[nombre] = !estados[nombre];
    div.classList.toggle('activo', estados[nombre]);
    div.querySelector('.switch').classList.toggle('on', estados[nombre]);
    div.querySelector('.estado').textContent = estados[nombre] ? 'ON' : 'OFF';
  };
  cont.appendChild(div);
});

let btn = document.getElementById('btnFlotante');
let menu = document.getElementById('menuFlotante');
let menuAbierto = false;

function abrirMenu(){
  // EL MENU SE ABRE JUSTO DONDE ESTA EL BOTON
  let r = btn.getBoundingClientRect();
  let x = r.left;
  let y = r.bottom + 10;
  // Si no cabe abajo, lo abre arriba del boton
  if(y + 420 > window.innerHeight) y = r.top - 430;
  if(y < 10) y = 10;
  // Si no cabe a la derecha, lo corre a la izquierda
  if(x + 280 > window.innerWidth) x = window.innerWidth - 290;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
  menuAbierto = true;
}
function cerrarMenu(){
  menu.style.display = 'none';
  menuAbierto = false;
}
function toggleMenu(){
  if(menuAbierto) cerrarMenu();
  else abrirMenu();
}

// MINI BOTON DENTRO DEL MENU PARA CERRAR
document.getElementById('miniCerrar').onclick = (e) => {
  e.stopPropagation();
  cerrarMenu();
};

// --- MOVER EL BOTON FLOTANTE ---
let moviendoBtn=false, seMovioBtn=false, sx, sy, bx, by;
btn.addEventListener('touchstart', e=>{
  moviendoBtn=true; seMovioBtn=false;
  let t=e.touches[0]; sx=t.clientX; sy=t.clientY;
  let r=btn.getBoundingClientRect(); bx=r.left; by=r.top;
},{passive:false});
btn.addEventListener('touchmove', e=>{
  if(!moviendoBtn) return;
  e.preventDefault();
  let t=e.touches[0];
  let dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>8 || Math.abs(dy)>8) seMovioBtn=true;
  let nx=Math.max(0,Math.min(window.innerWidth-62, bx+dx));
  let ny=Math.max(0,Math.min(window.innerHeight-62, by+dy));
  btn.style.left=nx+'px'; btn.style.top=ny+'px';
},{passive:false});
btn.addEventListener('touchend', ()=>{
  moviendoBtn=false;
  if(!seMovioBtn) toggleMenu();
});

// --- MOVER EL MENU DE FUNCIONES ---
let cab = document.getElementById('cabeceraMenu');
let moviendoMenu=false, mx, my, menX, menY;
cab.addEventListener('touchstart', e=>{
  moviendoMenu=true;
  let t=e.touches[0]; mx=t.clientX; my=t.clientY;
  let r=menu.getBoundingClientRect(); menX=r.left; menY=r.top;
},{passive:false});
cab.addEventListener('touchmove', e=>{
  if(!moviendoMenu) return;
  e.preventDefault();
  let t=e.touches[0];
  let nx=Math.max(0,Math.min(window.innerWidth-280, menX + (t.clientX-mx)));
  let ny=Math.max(0,Math.min(window.innerHeight-100, menY + (t.clientY-my)));
  menu.style.left=nx+'px'; menu.style.top=ny+'px';
},{passive:false});
cab.addEventListener('touchend', ()=>{ moviendoMenu=false; });
</script>
</body>
</html>
