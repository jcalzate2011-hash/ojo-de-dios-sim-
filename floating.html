<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:Arial;padding:20px;padding-bottom:120px;overflow:hidden}
h1{font-size:18px}
p{font-size:13px;color:#aaa;margin-top:8px}

/* BOTÓN FLOTANTE QUE SE MUEVE */
#btnFlotante{
  position:fixed;
  bottom:90px; right:16px;
  width:60px; height:60px;
  background:#00ff88;
  color:#000;
  border:none;
  border-radius:50%;
  font-size:26px;
  font-weight:900;
  z-index:999;
  box-shadow:0 4px 20px rgba(0,255,136,.6);
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

#fondo{
  position:fixed; inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  z-index:998;
}

#menuFlotante{
  position:fixed;
  left:16px; right:16px; bottom:30px;
  background:#1a1a1a;
  border:1px solid #333;
  border-radius:18px;
  padding:14px;
  display:none;
  z-index:999;
}
#menuFlotante h2{font-size:16px;margin-bottom:10px}

/* FILA ESP FOV */
.fila-esp{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#222;
  border:1px solid #444;
  border-radius:12px;
  padding:14px;
  margin:6px 0;
}
.fila-esp.activo{border-color:#00ff88;background:#123324}
.fila-esp span{font-size:14px;font-weight:700}
#estadoESP{font-size:12px;padding:5px 10px;border-radius:20px;background:#444;color:#fff}
.fila-esp.activo #estadoESP{background:#00ff88;color:#000}

/* SWITCH */
.switch{position:relative;width:52px;height:28px;background:#555;border-radius:30px;cursor:pointer;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:#00ff88}
.switch.on::after{left:27px}

#cerrar{
  width:100%;
  background:#ff3333;
  border:none;
  color:#fff;
  border-radius:12px;
  padding:12px;
  margin-top:8px;
  font-weight:900;
  cursor:pointer;
}

/* DEMO PARA VER EL CAMBIO */
#demoESP{
  margin-top:20px;
  border:2px dashed #444;
  border-radius:14px;
  padding:20px;
  text-align:center;
  transition:.3s;
}
#demoESP.activo{border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,.5)}
</style>
</head>
<body>

<h1>Mi juego / Mi app</h1>
<p>Arrastra el botón verde a donde quieras. Tócalo 1 vez para abrir el menú.</p>

<div id="demoESP">
  <div style="font-size:30px">👁️</div>
  <div id="textoDemo" style="margin-top:8px">ESP FOV: DESACTIVADO</div>
</div>

<button id="btnFlotante">☰</button>

<div id="fondo" onclick="cerrarMenu()"></div>

<div id="menuFlotante">
  <h2>☰ MENÚ</h2>
  
  <div class="fila-esp" id="filaESP" onclick="toggleESP()">
    <div>
      <span>ESP FOV</span><br>
      <span id="estadoESP">OFF</span>
    </div>
    <div class="switch" id="switchESP"></div>
  </div>

  <button id="cerrar" onclick="cerrarMenu()">CERRAR</button>
</div>

<script>
let btn = document.getElementById('btnFlotante');
let moviendo = false;
let seMovio = false;
let startX, startY, btnX, btnY;

btn.addEventListener('touchstart', function(e){
  moviendo = true;
  seMovio = false;
  let t = e.touches[0];
  startX = t.clientX;
  startY = t.clientY;
  let r = btn.getBoundingClientRect();
  btnX = r.left;
  btnY = r.top;
}, {passive:false});

btn.addEventListener('touchmove', function(e){
  if(!moviendo) return;
  e.preventDefault();
  let t = e.touches[0];
  let dx = t.clientX - startX;
  let dy = t.clientY - startY;
  if(Math.abs(dx) > 8 || Math.abs(dy) > 8) seMovio = true;
  let nx = btnX + dx;
  let ny = btnY + dy;
  // No dejar que se salga de la pantalla
  nx = Math.max(0, Math.min(window.innerWidth - 60, nx));
  ny = Math.max(0, Math.min(window.innerHeight - 60, ny));
  btn.style.left = nx + 'px';
  btn.style.top = ny + 'px';
  btn.style.right = 'auto';
  btn.style.bottom = 'auto';
}, {passive:false});

btn.addEventListener('touchend', function(){
  moviendo = false;
  // Si NO se movió, fue un toque = abrir menú
  if(!seMovio){
    abrirMenu();
  }
});

// Para que también funcione con mouse en PC
btn.addEventListener('mousedown', function(e){
  moviendo = true; seMovio = false;
  startX = e.clientX; startY = e.clientY;
  let r = btn.getBoundingClientRect();
  btnX = r.left; btnY = r.top;
});
document.addEventListener('mousemove', function(e){
  if(!moviendo) return;
  let dx = e.clientX - startX;
  let dy = e.clientY - startY;
  if(Math.abs(dx) > 8 || Math.abs(dy) > 8) seMovio = true;
  let nx = btnX + dx;
  let ny = btnY + dy;
  nx = Math.max(0, Math.min(window.innerWidth - 60, nx));
  ny = Math.max(0, Math.min(window.innerHeight - 60, ny));
  btn.style.left = nx + 'px';
  btn.style.top = ny + 'px';
  btn.style.right = 'auto';
  btn.style.bottom = 'auto';
});
document.addEventListener('mouseup', function(){
  if(moviendo && !seMovio){
    // Click sin arrastrar en PC
    if(window.innerWidth > 768) abrirMenu();
  }
  moviendo = false;
});

function abrirMenu(){
  document.getElementById('menuFlotante').style.display='block';
  document.getElementById('fondo').style.display='block';
}
function cerrarMenu(){
  document.getElementById('menuFlotante').style.display='none';
  document.getElementById('fondo').style.display='none';
}

let espActivo = false;
function toggleESP(){
  espActivo = !espActivo;
  document.getElementById('filaESP').classList.toggle('activo', espActivo);
  document.getElementById('switchESP').classList.toggle('on', espActivo);
  document.getElementById('estadoESP').textContent = espActivo ? 'ON' : 'OFF';
  document.getElementById('demoESP').classList.toggle('activo', espActivo);
  document.getElementById('textoDemo').textContent = espActivo ? 'ESP FOV: ACTIVADO' : 'ESP FOV: DESACTIVADO';
}
</script>
</body>
  </html>
