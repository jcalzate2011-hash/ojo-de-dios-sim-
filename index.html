<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;justify-content:center;padding:20px 12px;overflow-x:hidden}
.wrap{width:100%;max-width:480px;text-align:center}
.eye{font-size:48px;margin:6px 0 14px}
.box{border:1px solid #00ff88;border-radius:16px;padding:20px 16px;text-align:left;box-shadow:0 0 20px rgba(0,255,136,.2);margin-bottom:16px}
.label{color:#00ff88;font-size:15px;margin-bottom:12px}
input{width:100%;background:#000;border:1.5px solid #00ff88;border-radius:12px;color:#00ff88;padding:16px;font-size:20px;font-family:monospace;outline:none;margin-bottom:14px}
button{width:100%;background:#00ff88;color:#000;border:none;border-radius:12px;padding:16px;font-size:20px;font-weight:900;cursor:pointer}
button:disabled{opacity:.6}
.bar-wrap{width:100%;height:14px;background:#022c1a;border-radius:20px;overflow:hidden;margin:18px 0 8px}
#bar{height:100%;width:0%;background:#00ff88;transition:width .3s}
#status{font-size:16px;min-height:22px}
#result{width:100%;height:320px;border:1px solid #00ff88;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at center, rgba(0,255,200,.15), transparent 70%);box-shadow:0 0 20px rgba(0,255,136,.2)}
#globe{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#00ff8888;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<div class="eye">👁️</div>

<div class="box">
<div class="label">&gt; Escribe cualquier nombre o número:</div>
<input id="q" placeholder="" value="">
<button id="btn" onclick="buscar()">🔍 BUSCAR</button>
<div class="bar-wrap"><div id="bar"></div></div>
<div id="status">&gt; Listo.</div>
</div>

<div id="result">
<canvas id="globe"></canvas>
<div class="hint">↔ Arrastra para girar el planeta</div>
</div>

</div>

<script>
let canvas=document.getElementById('globe');
let ctx=canvas.getContext('2d');
let rotY=0.6, rotX=0.3;
let targetY=0.6, targetX=0.3;
let dragging=false, px=0, py=0;

function resize(){
  let box=document.getElementById('result');
  canvas.width=box.clientWidth*2;
  canvas.height=box.clientHeight*2;
}
window.addEventListener('resize', resize);
resize();

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let cx=canvas.width/2, cy=canvas.height/2;
  let R=Math.min(canvas.width, canvas.height)*0.32;

  // Resplandor
  let grad=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*1.8);
  grad.addColorStop(0,'rgba(0,255,200,0.25)');
  grad.addColorStop(1,'rgba(0,255,200,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Anillos
  ctx.strokeStyle='rgba(0,255,200,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.45,R*0.4,0.5,0,Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle='rgba(0,150,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.7,R*0.35,-0.4,0,Math.PI*2);
  ctx.stroke();

  // Esfera azul-verde transparentosa
  let g2=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
  g2.addColorStop(0,'rgba(0,255,180,0.55)');
  g2.addColorStop(0.5,'rgba(0,180,255,0.30)');
  g2.addColorStop(1,'rgba(0,80,180,0.15)');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();

  // Latitudes y longitudes holograma
  ctx.strokeStyle='rgba(0,255,170,0.65)';
  ctx.lineWidth=1.5;
  for(let i=-60;i<=60;i+=30){
    let y=Math.sin(i*Math.PI/180)*Math.cos(rotX) - Math.cos(i*Math.PI/180)*Math.sin(rotX)*0.2;
    ctx.beginPath();
    ctx.ellipse(cx, cy + y*R, R, Math.abs(Math.cos(i*Math.PI/180))*R*0.9+2, 0, 0, Math.PI*2);
    ctx.stroke();
  }
  for(let j=0;j<12;j++){
    let a=rotY + j*Math.PI/6;
    let rx=Math.abs(Math.cos(a))*R;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, R, 0, 0, Math.PI*2);
    ctx.stroke();
  }

  // Puntos brillantes
  for(let i=0;i<90;i++){
    let lat=(i*137.5 % 180 - 90)*Math.PI/180;
    let lon=(i*89.7 % 360)*Math.PI/180 + rotY;
    let x=Math.cos(lat)*Math.sin(lon);
    let y=Math.sin(lat)*Math.cos(rotX) - Math.cos(lat)*Math.cos(lon)*Math.sin(rotX);
    let z=Math.cos(lat)*Math.cos(lon);
    if(z > -0.2){
      let px2=cx + x*R;
      let py2=cy + y*R;
      ctx.fillStyle='rgba(150,255,210,0.9)';
      ctx.beginPath(); ctx.arc(px2,py2,3,0,Math.PI*2); ctx.fill();
    }
  }

  // Borde
  ctx.strokeStyle='rgba(0,255,200,0.9)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();

  // Suave al soltar
  rotY += (targetY-rotY)*0.12;
  rotX += (targetX-rotX)*0.12;
  requestAnimationFrame(draw);
}
draw();

// SOLO SE MUEVE CUANDO LO MUEVES TU
canvas.addEventListener('pointerdown', e=>{dragging=true; px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  let dx=e.clientX-px, dy=e.clientY-py;
  targetY+=dx*0.01; targetX+=dy*0.01;
  targetX=Math.max(-1, Math.min(1, targetX));
  px=e.clientX; py=e.clientY;
});
window.addEventListener('pointerup', ()=>{dragging=false});

let timer=null;
function buscar(){
  if(timer) return;
  let btn=document.getElementById('btn');
  let bar=document.getElementById('bar');
  let status=document.getElementById('status');
  btn.disabled=true; bar.style.width='0%'; status.textContent='> Buscando... 0%';
  let p=0;
  timer=setInterval(()=>{
    p++; bar.style.width=p+'%'; status.textContent='> Buscando... '+p+'%';
    if(p>=100){ clearInterval(timer); timer=null; status.textContent='> Listo.'; btn.disabled=false; }
  },600);
}
</script>
</body>
</html>
