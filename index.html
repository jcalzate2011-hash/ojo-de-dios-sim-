<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👁️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;justify-content:center;padding:20px 12px;overflow-x:hidden}
.wrap{width:100%;max-width:480px;text-align:center}
.eye{font-size:48px;margin:6px 0 14px}
.box{border:1px solid #00ff88;border-radius:16px;padding:20px 16px;text-align:left;box-shadow:0 0 20px rgba(0,255,136,.2);margin-bottom:16px}
.label{color:#00ff88;font-size:15px;margin-bottom:12px}
input{width:100%;background:#000;border:1.5px solid #00ff88;border-radius:12px;color:#00ff88;padding:16px;font-size:20px;font-family:monospace;outline:none;margin-bottom:14px}
button{width:100%;background:#00ff88;color:#000;border:none;border-radius:12px;padding:16px;font-size:20px;font-weight:900;cursor:pointer}
button:disabled{opacity:.6}
.bar-wrap{width:100%;height:14px;background:#022c1a;border-radius:20px;overflow:hidden;margin:18px 0 8px}
#bar{height:100%;width:0%;background:#00ff88;transition:width .3s}
#status{font-size:16px;min-height:22px}
#result{width:100%;height:320px;border:1px solid #00ff88;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at center, rgba(0,255,200,.15), transparent 70%);box-shadow:0 0 20px rgba(0,255,136,.2)}
#globe{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#00ff8888;pointer-events:none}
.btn-cam{margin-top:14px;background:#000;color:#00ff88;border:1.5px solid #00ff88;letter-spacing:2px}
.btn-cam:active{background:#00ff88;color:#000}

/* MODO CAMARA - PANTALLA COMPLETA */
body.cam-mode{padding:0;overflow:hidden}
body.cam-mode .wrap{max-width:100%}
body.cam-mode .eye, body.cam-mode .box, body.cam-mode .btn-cam{display:none}
body.cam-mode #result{position:fixed;inset:0;width:100vw;height:100dvh;border:none;border-radius:0;box-shadow:none;background:#000;z-index:10}
body.cam-mode #result .hint{display:none}
#staBtn{display:none}
body.cam-mode #staBtn{display:block;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;width:150px;background:#00ff88;color:#000;border:2px solid #00ff88;border-radius:30px;padding:14px;font-size:20px;font-weight:900;letter-spacing:4px;box-shadow:0 0 20px #00ff88}
#zoomControls{display:none}
body.cam-mode #zoomControls{display:flex;position:fixed;right:14px;top:50%;transform:translateY(-50%);flex-direction:column;gap:10px;z-index:30}
#zoomControls button{width:50px;height:50px;padding:0;border-radius:50%;background:rgba(0,0,0,.7);color:#00ff88;border:1.5px solid #00ff88;font-size:24px}
#zoomLabel{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:30;color:#00ff88;font-size:14px;letter-spacing:2px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px;border:1px solid #00ff88;display:none}
body.cam-mode #zoomLabel{display:block}
</style>
</head>
<body>
<div class="wrap">
<div class="eye">👁️</div>

<div class="box">
<div class="label">&gt; Escribe cualquier nombre o número:</div>
<input id="q" placeholder="" value="">
<button id="btn" onclick="buscar()">🔍 BUSCAR</button>
<div class="bar-wrap"><div id="bar"></div></div>
<div id="status">&gt; Listo.</div>
</div>

<div id="result">
<canvas id="globe"></canvas>
<div class="hint">↔ Arrastra para girar el planeta 360°</div>
</div>

<button class="btn-cam" onclick="openCam()">📷 CAMERAT HK</button>

</div>

<!-- SOLO EN MODO CAMARA -->
<div id="zoomLabel">ZOOM 1.0x</div>
<div id="zoomControls">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">-</button>
</div>
<button id="staBtn" onclick="closeCam()">STA</button>

<script>
let canvas=document.getElementById('globe');
let ctx=canvas.getContext('2d');
let rotY=0.6, rotX=0.3;
let targetY=0.6, targetX=0.3;
let dragging=false, px=0, py=0;
let zoom=1, targetZoom=1;

function resize(){
  let box=document.getElementById('result');
  canvas.width=box.clientWidth*2;
  canvas.height=box.clientHeight*2;
}
window.addEventListener('resize', resize);
resize();

function rotate3D(x,y,z){
  let cx=Math.cos(rotX), sx=Math.sin(rotX);
  let y1=y*cx - z*sx;
  let z1=y*sx + z*cx;
  let cy=Math.cos(rotY), sy=Math.sin(rotY);
  let x2=x*cy + z1*sy;
  let z2=-x*sy + z1*cy;
  return [x2,y1,z2];
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let cx=canvas.width/2, cy=canvas.height/2;
  // En modo cámara el planeta es más grande y enfocado
  let baseR=Math.min(canvas.width, canvas.height)*0.32;
  let R=baseR*zoom;
  if(document.body.classList.contains('cam-mode')) R=baseR*1.25*zoom;

  let grad=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*1.8);
  grad.addColorStop(0,'rgba(0,255,200,0.25)');
  grad.addColorStop(1,'rgba(0,255,200,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let g2=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
  g2.addColorStop(0,'rgba(0,255,180,0.55)');
  g2.addColorStop(0.5,'rgba(0,180,255,0.30)');
  g2.addColorStop(1,'rgba(0,80,180,0.15)');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle='rgba(0,255,170,0.65)';
  ctx.lineWidth=1.5;
  for(let lat=-60; lat<=60; lat+=30){
    let la=lat*Math.PI/180;
    ctx.beginPath();
    for(let a=0;a<=360;a+=6){
      let lon=a*Math.PI/180;
      let x=Math.cos(la)*Math.sin(lon);
      let y=Math.sin(la);
      let z=Math.cos(la)*Math.cos(lon);
      let p=rotate3D(x,y,z);
      let sx2=cx+p[0]*R, sy2=cy+p[1]*R;
      if(a===0) ctx.moveTo(sx2,sy2); else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
  }
  for(let m=0;m<12;m++){
    let lon=m*Math.PI/6;
    ctx.beginPath();
    for(let a=-90;a<=90;a+=6){
      let la=a*Math.PI/180;
      let x=Math.cos(la)*Math.sin(lon);
      let y=Math.sin(la);
      let z=Math.cos(la)*Math.cos(lon);
      let p=rotate3D(x,y,z);
      let sx2=cx+p[0]*R, sy2=cy+p[1]*R;
      if(a===-90) ctx.moveTo(sx2,sy2); else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
    ctx.beginPath();
    for(let a=-90;a<=90;a+=6){
      let la=a*Math.PI/180;
      let lon2=lon+Math.PI;
      let x=Math.cos(la)*Math.sin(lon2);
      let y=Math.sin(la);
      let z=Math.cos(la)*Math.cos(lon2);
      let p=rotate3D(x,y,z);
      let sx2=cx+p[0]*R, sy2=cy+p[1]*R;
      if(a===-90) ctx.moveTo(sx2,sy2); else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
  }

  for(let i=0;i<120;i++){
    let lat=(i*137.5 % 180 - 90)*Math.PI/180;
    let lon=(i*89.7 % 360)*Math.PI/180;
    let x=Math.cos(lat)*Math.sin(lon);
    let y=Math.sin(lat);
    let z=Math.cos(lat)*Math.cos(lon);
    let p=rotate3D(x,y,z);
    if(p[2] > -0.3){
      ctx.fillStyle='rgba(150,255,210,0.9)';
      ctx.beginPath(); ctx.arc(cx+p[0]*R, cy+p[1]*R, 3*zoom, 0, Math.PI*2); ctx.fill();
    }
  }

  // Anillos - en modo cámara más centrados
  ctx.strokeStyle='rgba(0,255,200,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.45,R*0.4,0.5,0,Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle='rgba(0,150,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.7,R*0.35,-0.4,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle='rgba(0,255,200,0.9)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();

  rotY += (targetY-rotY)*0.12;
  rotX += (targetX-rotX)*0.12;
  zoom += (targetZoom-zoom)*0.15;
  requestAnimationFrame(draw);
}
draw();

// Girar 360° con 1 dedo
let pointers=new Map();
let lastPinch=0;
canvas.addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragging=true; px=e.clientX; py=e.clientY; }
  if(pointers.size===2){
    let pts=[...pointers.values()];
    lastPinch=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===2){
    // ZOOM CON 2 DEDOS COMO CÁMARA
    let pts=[...pointers.values()];
    let dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(lastPinch>0){
      targetZoom = Math.max(0.5, Math.min(3, targetZoom * (dist/lastPinch)));
      updateZoomLabel();
    }
    lastPinch=dist;
    return;
  }
  if(!dragging) return;
  let dx=e.clientX-px, dy=e.clientY-py;
  targetY+=dx*0.012;
  targetX+=dy*0.012;
  px=e.clientX; py=e.clientY;
});
window.addEventListener('pointerup', e=>{ pointers.delete(e.pointerId); if(pointers.size===0) dragging=false; lastPinch=0; });
window.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); dragging=false; });

// Zoom con rueda del mouse también
canvas.addEventListener('wheel', e=>{ e.preventDefault(); targetZoom=Math.max(0.5, Math.min(3, targetZoom + (e.deltaY<0?0.2:-0.2))); updateZoomLabel(); }, {passive:false});

function updateZoomLabel(){
  document.getElementById('zoomLabel').textContent='ZOOM '+targetZoom.toFixed(1)+'x';
}
function zoomIn(){ targetZoom=Math.min(3, targetZoom+0.3); updateZoomLabel(); }
function zoomOut(){ targetZoom=Math.max(0.5, targetZoom-0.3); updateZoomLabel(); }

// ABRIR / CERRAR CAMARA
function openCam(){
  document.body.classList.add('cam-mode');
  targetZoom=1; zoom=1; updateZoomLabel();
  setTimeout(resize, 50);
}
function closeCam(){
  document.body.classList.remove('cam-mode');
  targetZoom=1; zoom=1;
  setTimeout(resize, 50);
}

let timer=null;
function buscar(){
  if(timer) return;
  let btn=document.getElementById('btn');
  let bar=document.getElementById('bar');
  let status=document.getElementById('status');
  btn.disabled=true; bar.style.width='0%'; status.textContent='> Buscando... 0%';
  let p=0;
  timer=setInterval(()=>{
    p++; bar.style.width=p+'%'; status.textContent='> Buscando... '+p+'%';
    if(p>=100){ clearInterval(timer); timer=null; status.textContent='> Listo.'; btn.disabled=false; }
  },600);
}
</script>
</body>
  </html>
