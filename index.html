<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>👁️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;justify-content:center;padding:20px 12px;overflow-x:hidden}
.wrap{width:100%;max-width:480px;text-align:center}
.eye{font-size:48px;margin:6px 0 14px}
.box{border:1px solid #00ff88;border-radius:16px;padding:20px 16px;text-align:left;box-shadow:0 0 20px rgba(0,255,136,.2);margin-bottom:16px}
.label{color:#00ff88;font-size:15px;margin-bottom:12px}
input{width:100%;background:#000;border:1.5px solid #00ff88;border-radius:12px;color:#00ff88;padding:16px;font-size:20px;font-family:monospace;outline:none;margin-bottom:14px}
button{width:100%;background:#00ff88;color:#000;border:none;border-radius:12px;padding:16px;font-size:20px;font-weight:900;cursor:pointer}
button:disabled{opacity:.6}
.bar-wrap{width:100%;height:14px;background:#022c1a;border-radius:20px;overflow:hidden;margin:18px 0 8px}
#bar{height:100%;width:0%;background:#00ff88;transition:width .3s}
#status{font-size:16px;min-height:22px}
#result{width:100%;height:320px;border:1px solid #00ff88;border-radius:16px;position:relative;overflow:hidden;background:radial-gradient(circle at center, rgba(0,255,200,.15), transparent 70%);box-shadow:0 0 20px rgba(0,255,136,.2)}
#globe{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe:active{cursor:grabbing}
.hint{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#00ff8888;pointer-events:none}
.btn-cam{margin-top:14px;background:#000;color:#00ff88;border:1.5px solid #00ff88;letter-spacing:2px}
.btn-cam:active{background:#00ff88;color:#000}
body.cam-mode{padding:0;overflow:hidden}
body.cam-mode .wrap{max-width:100%}
body.cam-mode .eye, body.cam-mode .box, body.cam-mode .btn-cam{display:none}
body.cam-mode #result{position:fixed;inset:0;width:100vw;height:100dvh;border:none;border-radius:0;box-shadow:none;background:#000;z-index:10}
body.cam-mode #result .hint{display:none}
#staBtn{display:none}
body.cam-mode #staBtn{display:block;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;width:150px;background:#000;color:#00ff88;border:2px solid #00ff88;border-radius:30px;padding:14px;font-size:20px;font-weight:900;letter-spacing:4px;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
<div class="eye">👁️</div>

<div class="box">
<div class="label">&gt; Escribe cualquier nombre o número:</div>
<input id="q" placeholder="" value="">
<button id="btn" onclick="buscar()">🔍 BUSCAR</button>
<div class="bar-wrap"><div id="bar"></div></div>
<div id="status">&gt; Listo.</div>
</div>

<div id="result">
<canvas id="globe"></canvas>
<div class="hint">↔ Arrastra para girar el planeta 360°</div>
</div>

<button class="btn-cam" onclick="openCam()">📷 CAMERAT HK</button>

</div>

<button id="staBtn" onclick="closeCam()">STA</button>

<script>
let canvas=document.getElementById('globe');
let ctx=canvas.getContext('2d');
let rotY=0.6, rotX=0.3;
let targetY=0.6, targetX=0.3;
let dragging=false, px=0, py=0;
let zoom=1, targetZoom=1;

function resize(){
  let box=document.getElementById('result');
  canvas.width=box.clientWidth*2;
  canvas.height=box.clientHeight*2;
}
window.addEventListener('resize', resize);
resize();

function rotate3D(x,y,z){
  let cx=Math.cos(rotX), sx=Math.sin(rotX);
  let y1=y*cx - z*sx;
  let z1=y*sx + z*cx;
  let cy=Math.cos(rotY), sy=Math.sin(rotY);
  let x2=x*cy + z1*sy;
  let z2=-x*sy + z1*cy;
  return [x2,y1,z2];
}

const CONTINENTS=[
  [[72,-168],[70,-155],[70,-140],[69,-130],[68,-120],[67,-110],[65,-100],[62,-95],[60,-90],[58,-85],[55,-82],[52,-78],[50,-70],[48,-68],[46,-70],[44,-72],[42,-76],[40,-75],[38,-78],[36,-80],[34,-82],[32,-85],[30,-88],[28,-92],[26,-96],[24,-100],[22,-103],[20,-105],[18,-103],[16,-98],[15,-93],[16,-88],[18,-85],[20,-87],[22,-90],[24,-100],[28,-108],[32,-114],[36,-120],[40,-125],[44,-125],[48,-128],[52,-130],[56,-132],[60,-140],[64,-145],[68,-155],[72,-168]],
  [[71,-166],[70,-158],[68,-150],[66,-145],[68,-138],[70,-130],[70,-122],[69,-115],[68,-110],[66,-115],[64,-120],[62,-128],[60,-135],[60,-145],[62,-155],[65,-162],[68,-168],[71,-166]],

  [[15,-93],[14,-88],[13,-85],[12,-82],[10,-80],[8,-78],[8,-82],[10,-85],[12,-88],[14,-92],[15,-93]],
  [[16,-95],[18,-92],[20,-90],[18,-87],[16,-90],[14,-92],[16,-95]],
  [[22,-82],[21,-78],[20,-75],[19,-72],[18,-70],[19,-68],[20,-65],[22,-62],[20,-64],[18,-66],[16,-62],[14,-60],[12,-62],[14,-66],[16,-70],[18,-74],[20,-78],[22,-82]],
  [[12,-72],[10,-75],[8,-77],[6,-76],[4,-74],[2,-72],[0,-68],[-2,-62],[-4,-55],[-6,-48],[-8,-40],[-10,-36],[-12,-38],[-15,-39],[-18,-40],[-22,-42],[-26,-47],[-30,-50],[-34,-53],[-38,-58],[-42,-62],[-46,-66],[-50,-70],[-54,-70],[-50,-68],[-46,-66],[-42,-64],[-38,-62],[-34,-60],[-30,-58],[-26,-56],[-22,-55],[-18,-53],[-14,-52],[-10,-55],[-6,-60],[-2,-65],[0,-70],[4,-73],[8,-75],[12,-72]],
  [[35,-6],[33,-2],[35,2],[36,6],[34,10],[32,14],[30,18],[30,22],[28,28],[26,32],[22,34],[18,38],[14,40],[12,43],[10,45],[6,42],[3,40],[0,36],[-3,35],[-8,34],[-12,34],[-16,33],[-20,32],[-25,31],[-30,29],[-34,24],[-35,19],[-32,16],[-28,15],[-24,14],[-20,13],[-16,11],[-12,10],[-8,8],[-4,6],[0,2],[3,-2],[5,-6],[7,-10],[9,-14],[12,-16],[16,-16],[20,-16],[24,-15],[28,-12],[31,-8],[34,-6],[35,-6]],
  [[-12,44],[-14,46],[-16,48],[-18,47],[-20,46],[-22,45],[-24,44],[-22,42],[-18,42],[-14,42],[-12,44]],
  [[70,8],[68,12],[66,15],[64,18],[62,20],[60,22],[58,24],[56,22],[54,20],[52,18],[50,16],[48,14],[46,12],[44,10],[42,8],[40,6],[38,4],[36,2],[35,0],[36,-2],[38,-4],[40,-6],[42,-8],[44,-10],[46,-8],[48,-6],[50,-4],[52,-2],[54,0],[56,2],[58,4],[60,6],[62,8],[64,10],[66,10],[68,8],[70,8]],
  [[58,-2],[56,-2],[54,-3],[52,-4],[51,-2],[52,0],[54,1],[56,0],[58,-2]],
  [[55,-8],[54,-6],[53,-6],[52,-8],[53,-10],[55,-8]],
  [[64,-22],[65,-18],[66,-15],[64,-14],[63,-18],[63,-22],[64,-22]],
  [[36,36],[34,38],[32,40],[30,42],[28,44],[26,46],[24,48],[22,50],[20,52],[18,54],[16,56],[14,54],[12,52],[14,48],[16,44],[18,42],[20,40],[22,38],[24,36],[26,34],[28,32],[30,30],[32,32],[34,34],[36,36]],
  [[72,30],[70,40],[68,50],[66,60],[64,70],[62,80],[60,90],[58,100],[56,110],[54,120],[52,130],[50,140],[48,150],[46,160],[44,170],[46,178],[50,175],[54,168],[58,160],[62,150],[66,140],[70,130],[72,120],[74,110],[74,100],[74,90],[74,80],[74,70],[74,60],[74,50],[74,40],[72,30]],
  [[35,68],[32,70],[28,72],[24,74],[20,76],[16,78],[12,80],[8,78],[6,80],[8,76],[10,72],[12,68],[14,64],[16,62],[18,60],[20,62],[22,64],[24,66],[28,66],[32,66],[35,68]],
  [[40,115],[38,120],[35,122],[32,120],[28,118],[24,115],[20,110],[16,105],[12,108],[10,105],[8,102],[6,100],[8,98],[10,96],[14,98],[18,102],[22,105],[26,108],[30,110],[34,112],[38,114],[40,115]],
  [[18,98],[16,100],[14,102],[12,104],[10,106],[8,104],[6,102],[4,100],[2,102],[0,104],[-2,108],[-4,112],[-6,115],[-8,118],[-6,122],[-4,125],[-2,128],[0,130],[2,128],[0,124],[2,120],[4,116],[6,112],[8,108],[10,104],[12,102],[14,100],[16,98],[18,98]],
  [[45,142],[42,144],[38,142],[35,140],[33,138],[34,132],[36,134],[38,138],[40,140],[43,142],[45,142]],
  [[-10,113],[-12,118],[-14,122],[-16,124],[-18,122],[-20,118],[-22,114],[-26,113],[-30,114],[-34,116],[-35,120],[-35,126],[-35,132],[-34,138],[-32,140],[-28,144],[-24,148],[-20,150],[-16,148],[-12,144],[-10,138],[-10,130],[-10,122],[-10,113]],
  [[-35,173],[-37,175],[-39,176],[-41,174],[-43,172],[-45,170],[-43,168],[-40,170],[-38,172],[-36,174],[-35,173]]
];

// ONDULACIÓN PROFUNDA Y VARIADA: unas partes bien metidas, otras salidas
function smoothPoly(poly){
  let out=[];
  let n=poly.length;
  for(let i=0;i<n;i++){
    let p0=poly[(i-1+n)%n], p1=poly[i], p2=poly[(i+1)%n], p3=poly[(i+2)%n];
    for(let t=0;t<1;t+=0.10){
      let t2=t*t, t3=t2*t;
      let lat=0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      let lon=0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      // 2 ondas mezcladas: una profunda y otra suave, por eso unas partes quedan profundas y otras no
      let deep=Math.sin(i*1.7+t*5.2)*1.4 + Math.sin(i*3.9+t*9.1)*0.7 + Math.sin(i*0.6+t*2.0)*0.5;
      // Más profundo en algunas zonas, más suave en otras
      let amp = (i%3===0) ? 1.3 : 0.6;
      out.push([lat+deep*amp*0.45, lon+deep*amp*0.55]);
    }
  }
  return out;
}
const SMOOTHED=CONTINENTS.map(p=>smoothPoly(p));

function drawContinent(poly, cx, cy, R){
  // Convierte todo el continente a puntos 3D y calcula su profundidad promedio
  let pts=[];
  let sumZ=0;
  for(let i=0;i<poly.length;i++){
    let lat=poly[i][0]*Math.PI/180;
    let lon=poly[i][1]*Math.PI/180;
    let x=Math.cos(lat)*Math.sin(lon);
    let y=Math.sin(lat);
    let z=Math.cos(lat)*Math.cos(lon);
    let p=rotate3D(x,y,z);
    pts.push([cx+p[0]*R, cy+p[1]*R, p[2]]);
    sumZ+=p[2];
  }
  return {pts, avgZ: sumZ/poly.length};
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let cx=canvas.width/2, cy=canvas.height/2;
  let baseR=Math.min(canvas.width, canvas.height)*0.32;
  let R=baseR*zoom;
  if(document.body.classList.contains('cam-mode')) R=baseR*1.25*zoom;

  let grad=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*1.8);
  grad.addColorStop(0,'rgba(0,255,200,0.25)');
  grad.addColorStop(1,'rgba(0,255,200,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  let g2=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.1,cx,cy,R);
  g2.addColorStop(0,'rgba(0,255,180,0.55)');
  g2.addColorStop(0.5,'rgba(0,180,255,0.30)');
  g2.addColorStop(1,'rgba(0,80,180,0.15)');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();

  // SOLUCIÓN A PAÍSES ENCIMA DE OTROS: recortar al círculo y dibujar de atrás hacia adelante
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();

  let all=[];
  for(let c=0;c<SMOOTHED.length;c++){
    all.push(drawContinent(SMOOTHED[c], cx, cy, R));
  }
  // Orden por profundidad: los de atrás primero, los de adelante al final
  all.sort((a,b)=>a.avgZ-b.avgZ);

  for(let k=0;k<all.length;k++){
    let pts=all[k].pts;
    // Si el continente está casi todo atrás, lo dibuja más tenue para que no tape al de adelante
    let alpha = pts.length>0 && all[k].avgZ < -0.2 ? 0.10 : 0.22;
    let strokeA = all[k].avgZ < -0.2 ? 0.3 : 0.95;
    ctx.fillStyle='rgba(0,255,140,'+alpha+')';
    ctx.strokeStyle='rgba(0,255,170,'+strokeA+')';
    ctx.lineWidth=1.4;
    ctx.lineJoin='round';
    ctx.lineCap='round';
    ctx.beginPath();
    let started=false;
    for(let i=0;i<pts.length;i++){
      // Solo dibuja la parte que está de frente, la de atrás no se dibuja
      if(pts[i][2] < 0.02){ started=false; continue; }
      if(!started){ ctx.moveTo(pts[i][0], pts[i][1]); started=true; }
      else ctx.lineTo(pts[i][0], pts[i][1]);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  ctx.restore();

  ctx.strokeStyle='rgba(0,255,170,0.35)';
  ctx.lineWidth=1;
  for(let lat=-60; lat<=60; lat+=30){
    let la=lat*Math.PI/180;
    ctx.beginPath();
    for(let a=0;a<=360;a+=6){
      let lon=a*Math.PI/180;
      let x=Math.cos(la)*Math.sin(lon);
      let y=Math.sin(la);
      let z=Math.cos(la)*Math.cos(lon);
      let p=rotate3D(x,y,z);
      let sx2=cx+p[0]*R, sy2=cy+p[1]*R;
      if(a===0) ctx.moveTo(sx2,sy2); else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
  }
  for(let m=0;m<12;m++){
    let lon=m*Math.PI/6;
    ctx.beginPath();
    for(let a=-90;a<=90;a+=6){
      let la=a*Math.PI/180;
      let x=Math.cos(la)*Math.sin(lon);
      let y=Math.sin(la);
      let z=Math.cos(la)*Math.cos(lon);
      let p=rotate3D(x,y,z);
      let sx2=cx+p[0]*R, sy2=cy+p[1]*R;
      if(a===-90) ctx.moveTo(sx2,sy2); else ctx.lineTo(sx2,sy2);
    }
    ctx.stroke();
  }

  for(let i=0;i<120;i++){
    let lat=(i*137.5 % 180 - 90)*Math.PI/180;
    let lon=(i*89.7 % 360)*Math.PI/180;
    let x=Math.cos(lat)*Math.sin(lon);
    let y=Math.sin(lat);
    let z=Math.cos(lat)*Math.cos(lon);
    let p=rotate3D(x,y,z);
    if(p[2] > -0.3){
      ctx.fillStyle='rgba(150,255,210,0.9)';
      ctx.beginPath(); ctx.arc(cx+p[0]*R, cy+p[1]*R, 3*zoom, 0, Math.PI*2); ctx.fill();
    }
  }

  ctx.strokeStyle='rgba(0,255,200,0.5)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.45,R*0.4,0.5,0,Math.PI*2);
  ctx.stroke();
  ctx.strokeStyle='rgba(0,150,255,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx,cy,R*1.7,R*0.35,-0.4,0,Math.PI*2);
  ctx.stroke();

  ctx.strokeStyle='rgba(0,255,200,0.9)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();

  rotY += (targetY-rotY)*0.12;
  rotX += (targetX-rotX)*0.12;
  zoom += (targetZoom-zoom)*0.15;
  requestAnimationFrame(draw);
}
draw();

let pointers=new Map();
let lastPinch=0;
canvas.addEventListener('pointerdown', e=>{
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragging=true; px=e.clientX; py=e.clientY; }
  if(pointers.size===2){
    let pts=[...pointers.values()];
    lastPinch=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  }
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===2){
    let pts=[...pointers.values()];
    let dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(lastPinch>0){
      targetZoom = Math.max(0.5, Math.min(3, targetZoom * (dist/lastPinch)));
    }
    lastPinch=dist;
    return;
  }
  if(!dragging) return;
  let dx=e.clientX-px, dy=e.clientY-py;
  targetY+=dx*0.012;
  targetX+=dy*0.012;
  px=e.clientX; py=e.clientY;
});
window.addEventListener('pointerup', e=>{ pointers.delete(e.pointerId); if(pointers.size===0) dragging=false; lastPinch=0; });
window.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); dragging=false; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); targetZoom=Math.max(0.5, Math.min(3, targetZoom + (e.deltaY<0?0.2:-0.2))); }, {passive:false});

function openCam(){
  document.body.classList.add('cam-mode');
  targetZoom=1; zoom=1;
  setTimeout(resize, 50);
}
function closeCam(){
  document.body.classList.remove('cam-mode');
  targetZoom=1; zoom=1;
  setTimeout(resize, 50);
}

let timer=null;
function buscar(){
  if(timer) return;
  let btn=document.getElementById('btn');
  let bar=document.getElementById('bar');
  let status=document.getElementById('status');
  btn.disabled=true; bar.style.width='0%'; status.textContent='> Buscando... 0%';
  let p=0;
  timer=setInterval(()=>{
    p++; bar.style.width=p+'%'; status.textContent='> Buscando... '+p+'%';
    if(p>=100){ clearInterval(timer); timer=null; status.textContent='> Listo.'; btn.disabled=false; }
  },600);
}
</script>
